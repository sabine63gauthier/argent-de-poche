<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argent de Poche</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
<div id="app" class="w-full max-w-sm bg-white p-6 rounded-2xl shadow-md">
<h2 class="text-2xl font-bold mb-4 text-center text-blue-600">Argent de Poche</h2>
<input id="email" type="email" placeholder="Email" class="w-full p-2 border mb-3 rounded-lg">
<input id="pass" type="password" placeholder="Mot de passe" class="w-full p-3 border mb-4 rounded-lg">
<button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold">Se connecter</button>
</div>
<script>
const config = {
apiKey: "AIzaSyDHsad9fwQ23ItoWmiYQZLDFJ6wfN9JpT4",
authDomain: "argent-de-poche-famille.firebaseapp.com",
projectId: "argent-de-poche-famille"
};
firebase.initializeApp(config);
function login() {
const email = document.getElementById('email').value;
const pass = document.getElementById('pass').value;
firebase.auth().signInWithEmailAndPassword(email, pass)
.then(() => alert("Succès ! Vous êtes connecté."))
.catch(e => alert("Erreur : " + e.message));
}
</script>
</body>
</html>
