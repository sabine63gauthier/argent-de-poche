<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argent de Poche</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex justify-center items-start">
  <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-md">
    <!-- CONNEXION -->
    <div id="login-card" class="block">
      <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">Connexion</h2>
      <input id="email" type="email" placeholder="Email" class="w-full p-2 border mb-3 rounded-lg">
      <input id="pass" type="password" placeholder="Mot de passe" class="w-full p-3 border mb-4 rounded-lg">
      <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold">Se connecter</button>
    </div>

    <!-- TABLEAU DE BORD -->
    <div id="dashboard" class="hidden">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <h2 id="user-title" class="text-xl font-bold text-blue-600">Chargement...</h2>
        <button onclick="logout()" class="text-red-500 font-semibold text-sm">Déconnexion</button>
      </div>

      <!-- VUE PARENT -->
      <div id="parent-view" class="hidden space-y-4">
        <select id="child-select" onchange="selectChild(this.value)" class="w-full p-2 border rounded-lg bg-gray-50 font-medium"></select>
        <div class="bg-blue-50 p-4 rounded-xl text-center">
          <p class="text-gray-600 text-sm">Solde Hebdomadaire Net</p>
          <h3 id="child-total" class="text-3xl font-bold text-blue-700">0</h3>
        </div>
        
        <!-- PROPOSITION DE CLÔTURE -->
        <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-200 space-y-3">
          <h3 class="font-bold text-yellow-800 text-sm">PROPOSITION DE CLÔTURE</h3>
          <div class="text-xs text-gray-700 space-y-1">
            <p>🎓 Efforts scolaires : <span id="stat-scolaires" class="font-bold">0</span>/3</p>
            <p>💶 Fixe : <span class="font-bold">5 €</span></p>
          </div>
          <div class="space-y-2 text-xs">
            <label class="flex items-center space-x-2">
              <input type="checkbox" id="check-prerequis" class="rounded">
              <span>Accorder 5 € de prérequis (Net ≥ 0)</span>
            </label>
            <label class="flex items-center space-x-2">
              <input type="checkbox" id="check-scolaire" class="rounded">
              <span>Accorder 5 € de bonus scolaire (Scolaires ≥ 3)</span>
            </label>
            <input id="parent-comment" type="text" placeholder="Commentaire final de clôture..." class="w-full p-2 border rounded bg-white">
          </div>
          <button onclick="validerSemaine()" class="w-full bg-yellow-600 text-white p-2 rounded-lg text-xs font-bold">VALIDER DÉFINITIVEMENT</button>
        </div>

        <!-- AJOUT D'ÉVÉNEMENT -->
        <div class="space-y-2">
          <input id="comment" type="text" placeholder="Commentaire d'activité..." class="w-full p-2 border rounded-lg">
          <div class="grid grid-cols-3 gap-2">
            <button onclick="addPoint('scolaire', 1)" class="bg-green-500 text-white p-2 rounded-lg text-xs font-bold">+1 Scolaire</button>
            <button onclick="addPoint('autre', 1)" class="bg-blue-500 text-white p-2 rounded-lg text-xs font-bold">+1 Autre</button>
            <button onclick="addPoint('manquement', -1)" class="bg-red-500 text-white p-2 rounded-lg text-xs font-bold">-1 Manque</button>
          </div>
        </div>
      </div>

      <!-- VUE ENFANT -->
      <div id="child-view" class="hidden space-y-4">
        <div class="bg-blue-50 p-4 rounded-xl text-center">
          <p class="text-gray-600 text-sm">Mon Solde de la Semaine</p>
          <h3 id="my-total" class="text-3xl font-bold text-blue-700">0</h3>
        </div>
      </div>

      <!-- HISTORIQUE REGROUPÉ -->
      <div class="mt-6 border-t pt-4">
        <h4 class="font-bold text-gray-700 mb-2 text-sm">Activités en cours</h4>
        <div id="events-list" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <script>
    const config = {
      apiKey: "AIzaSyDHsad9fwQ23ItoWmiYQZLDFJ6wfN9JpT4",
      authDomain: "argent-de-poche-famille.firebaseapp.com",
      projectId: "argent-de-poche-famille"
    };
    firebase.initializeApp(config);
    const db = firebase.firestore();
    let currentUser, unsubEvents, userRole, activeNetTotal = 0, activeScolaireCount = 0;

    firebase.auth().onAuthStateChanged(user => {
      currentUser = user;
      toggleView('login-card', !user);
      toggleView('dashboard', !!user);
      if (user) loadUser();
    });

    function login() {
      firebase.auth().signInWithEmailAndPassword(g('email').value, g('pass').value).catch(e => alert(e.message));
    }
    function logout() { firebase.auth().signOut(); if (unsubEvents) unsubEvents(); }
    function g(id) { return document.getElementById(id); }
    function toggleView(id, show) { g(id).classList.toggle('hidden', !show); }

    function loadUser() {
      db.collection('utilisateurs').doc(currentUser.uid).get().then(doc => {
        const data = doc.data();
        userRole = data.role;
        g('user-title').innerText = data.prenom;
        if (userRole === 'parent') {
          toggleView('parent-view', true);
          loadChildren();
        } else {
          toggleView('child-view', true);
          listenEvents(currentUser.uid, 'my-total');
        }
      });
    }

    function loadChildren() {
      db.collection('utilisateurs').where('role', '==', 'enfant').get().then(snap => {
        const select = g('child-select');
        select.innerHTML = '';
        snap.forEach(doc => {
          select.innerHTML += `<option value="${doc.id}">${doc.data().prenom}</option>`;
        });
        if (select.value) selectChild(select.value);
      });
    }

    function selectChild(id) {
      if (unsubEvents) unsubEvents();
      listenEvents(id, 'child-total');
    }

    function listenEvents(childId, totalElementId) {
      unsubEvents = db.collection('utilisateurs').doc(childId).collection('evenements').orderBy('date', 'desc')
        .onSnapshot(snap => {
          activeNetTotal = 0;
          activeScolaireCount = 0;
          
          let scolHtml = '', autrHtml = '', manqHtml = '';
          
          snap.forEach(doc => {
            const ev = doc.data();
            if (ev.cloture) return; // Filtrer archivés
            
            activeNetTotal += ev.valeur;
            if (ev.type === 'scolaire') activeScolaireCount++;
            
            // Formatage de la date et l'heure
            const rawDate = ev.date ? ev.date.toDate() : new Date();
            const dateStr = rawDate.toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            
            const color = ev.valeur > 0 ? (ev.type === 'scolaire' ? 'text-green-600' : 'text-blue-600') : 'text-red-600';
            const badge = ev.desaccord ? `<div class="text-orange-500 font-semibold mt-1">🟠 Contesté : "${ev.commEnfant}"</div>` : '';
            
            const actionBtn = (!ev.desaccord && userRole === 'enfant') ? `<button onclick="contester('${doc.id}')" class="text-red-500 underline ml-2 font-bold">Contester</button>` : '';
            const deleteBtn = (userRole === 'parent') ? `<button onclick="supprimerPoint('${doc.id}')" class="text-red-500 font-bold ml-2">❌</button>` : '';

            const itemHtml = `<div class="p-2 bg-gray-50 rounded-lg border border-gray-100 text-xs flex justify-between items-center">
              <div>
                <span><strong>${ev.commentaire}</strong> ${actionBtn}</span>
                <span class="text-gray-400 block text-[10px]">${dateStr}</span>
                ${badge}
              </div>
              <div class="flex items-center">
                <span class="${color} font-bold">${ev.valeur > 0 ? '+' : ''}${ev.valeur}</span>
                ${deleteBtn}
              </div>
            </div>`;

            if (ev.type === 'scolaire') scolHtml += itemHtml;
            else if (ev.type === 'autre') autrHtml += itemHtml;
            else if (ev.type === 'manquement') manqHtml += itemHtml;
          });
          
          g('events-list').innerHTML = `
            <div class="space-y-1">
              <p class="font-bold text-green-700 text-xs">🎓 Efforts Scolaires</p>
              ${scolHtml || '<p class="text-gray-400 text-[10px] italic">Aucun effort scolaire cette semaine.</p>'}
            </div>
            <div class="space-y-1 mt-3">
              <p class="font-bold text-blue-700 text-xs">🔵 Autres Efforts</p>
              ${autrHtml || '<p class="text-gray-400 text-[10px] italic">Aucun autre effort cette semaine.</p>'}
            </div>
            <div class="space-y-1 mt-3">
              <p class="font-bold text-red-700 text-xs">🔴 Manquements</p>
              ${manqHtml || '<p class="text-gray-400 text-[10px] italic">Aucun manquement cette semaine.</p>'}
            </div>
          `;
          
          g(totalElementId).innerText = activeNetTotal;
          if (userRole === 'parent') {
            g('stat-scolaires').innerText = activeScolaireCount;
            g('check-prerequis').checked = activeNetTotal >= 0;
            g('check-scolaire').checked = activeScolaireCount >= 3;
          }
        });
    }

    function addPoint(type, val) {
      const childId = g('child-select').value;
      const comm = g('comment').value;
      if (!childId) return;
      db.collection('utilisateurs').doc(childId).collection('evenements').add({
        type: type,
        commentaire: comm || (type === 'scolaire' ? 'Effort scolaire' : type === 'autre' ? 'Autre effort' : 'Manquement'),
        date: firebase.firestore.FieldValue.serverTimestamp(),
        valeur: val,
        desaccord: false,
        cloture: false
      }).then(() => g('comment').value = '');
    }

    function contester(eventId) {
      const raison = prompt("Pourquoi contestez-vous ce point ?");
      if (raison) {
        db.collection('utilisateurs').doc(currentUser.uid).collection('evenements').doc(eventId).update({
          desaccord: true,
          commEnfant: raison
        });
      }
    }

    function supprimerPoint(eventId) {
      if (confirm("Voulez-vous vraiment annuler/supprimer cette activité ?")) {
        const childId = g('child-select').value;
        db.collection('utilisateurs').doc(childId).collection('evenements').doc(eventId).delete();
      }
    }

    function validerSemaine() {
      const childId = g('child-select').value;
      if (!childId) return;
      const preVal = g('check-prerequis').checked;
      const scoVal = g('check-scolaire').checked;
      const comm = g('parent-comment').value;

      db.collection('utilisateurs').doc(childId).collection('clotures').add({
        date: firebase.firestore.FieldValue.serverTimestamp(),
        totalNet: activeNetTotal,
        scolaires: activeScolaireCount,
        prerequisAccorde: preVal,
        scolaireAccorde: scoVal,
        totalGagne: 5 + (preVal ? 5 : 0) + (scoVal ? 5 : 0),
        commentaire: comm
      }).then(() => {
        db.collection('utilisateurs').doc(childId).collection('evenements').where('cloture', '==', false).get()
          .then(snap => {
            const batch = db.batch();
            snap.forEach(doc => batch.update(doc.ref, { cloture: true }));
            batch.commit().then(() => {
              alert("Semaine clôturée et archivée !");
              g('parent-comment').value = '';
            });
          });
      });
    }
  </script>
</body>
</html>
